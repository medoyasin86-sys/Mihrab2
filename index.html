<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ملتقى طاعاتنا 2026 | النسخة المطورة</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
      --card-bg:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;
    }
    body.dark-mode{
      --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --primary:#2d6a4f;
    }
    body{
      font-family:'Amiri',serif; background-color:var(--bg); margin:0; padding:10px; color:var(--text);
      transition:background .3s;
    }
    .main-container{
      max-width:900px; margin:auto; background:var(--card-bg); border:3px double var(--gold); border-radius:20px;
      padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.2); position:relative; z-index:1;
    }

    .dark-mode-toggle{ position:fixed; top:15px; left:15px; z-index:1000; background:var(--gold); border:none; border-radius:50%;
      width:40px; height:40px; cursor:pointer; font-size:1.2rem; box-shadow:0 2px 10px rgba(0,0,0,.2); }
    .header-bar{ background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; padding:15px; border-radius:15px; text-align:center; border:2px solid var(--gold); }
    .header-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; align-items:center; }
    .refresh-btn{ background:linear-gradient(180deg,#ffe9b9,#e7cb83); border:1px solid var(--gold); color:#1a1a1a; padding:6px 10px; border-radius:20px; cursor:pointer; font-weight:800; }
    .city-select{ border:1px solid var(--gold); border-radius:8px; padding:4px 8px; background:#fff; color:#1a1a1a; font-weight:700; }
    body.dark-mode .city-select{ background:#252525; color:#fff; }

    .date-container{ background:rgba(255,255,255,.1); padding:10px; border-radius:12px; margin:10px 0; border:1px solid rgba(197,160,89,.3); }
    #hijri-display{ display:block; color:var(--gold-light); font-size:1.2rem; font-weight:bold; margin-bottom:5px; }
    .ramadan-day-hint{ display:none; margin-top:6px; font-weight:bold; background:#fff3cd; color:#856404; border:1px solid #ffeeba; padding:6px 10px; border-radius:8px; }

    .hijri-panel-toggle{ margin-top:8px; }
    .hijri-panel{
      display:none; margin-top:8px; background:#fff; color:#333; border:1px dashed var(--gold);
      border-radius:10px; padding:8px; text-align:start;
    }
    body.dark-mode .hijri-panel{ background:#252525; color:#eee; }
    .hijri-panel .row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; }
    .hijri-panel select, .hijri-panel input[type="number"]{
      border:1px solid var(--gold); border-radius:8px; padding:4px 8px; background:inherit; color:inherit;
    }
    .hijri-pill{
      display:inline-block; background:#fff7d6; color:#7a5a22; border:1px solid var(--gold);
      border-radius:999px; padding:2px 8px; margin-right:6px; font-weight:800;
    }
    .hijri-active-badge{
      display:none; font-size:.8rem; background:#1a4d2e; color:#fff; border:1px solid var(--gold);
      border-radius:999px; padding:2px 8px; margin-top:6px; font-weight:800;
    }

    .prayer-times-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:.8rem; background:rgba(0,0,0,.2); border-radius:10px; overflow:hidden; }
    .prayer-times-table th, .prayer-times-table td{ padding:5px; border:1px solid rgba(255,255,255,.1); text-align:center; }

    .next-prayer-banner{ background:rgba(255,255,255,.1); margin-top:10px; padding:10px; border-radius:10px; font-size:.9rem; border:1px solid var(--gold-light); line-height:1.6; }
    .timer-span{ color:var(--gold-light); font-family:sans-serif; font-weight:bold; }
    #prayer-wudu-alert{ display:none; background:linear-gradient(135deg,#fff9e6,#fffde7); border:2px solid var(--gold); color:#856404; padding:12px; border-radius:12px; margin-top:10px; text-align:center; font-weight:bold; box-shadow:0 0 15px rgba(197,160,89,.4); animation:lightPulse 2s infinite; }
    @keyframes lightPulse{ 0%{box-shadow:0 0 5px rgba(197,160,89,.4); transform:scale(1);} 50%{box-shadow:0 0 20px rgba(197,160,89,.8); transform:scale(1.01);} 100%{box-shadow:0 0 5px rgba(197,160,89,.4); transform:scale(1);} }

    .hijri-ramadan-bar{ background:var(--gold); color:#1a4d2e; margin-top:10px; border-radius:10px; padding:10px; font-weight:bold; display:flex; flex-direction:column; align-items:center; font-size:1rem; border:1px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.1); }
    .ramadan-timer{ color:#fff; background:var(--primary); padding:4px 15px; border-radius:20px; font-family:sans-serif; font-size:.9rem; margin-top:5px; direction:ltr; }
    .niya-alert{ background:#fff3cd; color:#856404; padding:10px; border-radius:10px; margin-top:10px; border:1px solid #ffeeba; font-weight:bold; animation:pulse 2s infinite; display:none; text-align:center; width:100%; box-sizing:border-box; }

    .hadith-marquee{ background:var(--accent); color:#fff; padding:12px 15px; border-radius:15px; font-size:1.1rem; border:2px solid var(--gold); margin:15px 0; box-shadow:0 4px 10px rgba(0,0,0,.1); text-align:center; display:flex; justify-content:center; align-items:center; min-height:40px; overflow:hidden; }
    .hadith-text{ display:block; white-space:normal; font-weight:bold; line-height:1.4; }

    .podium-section{ display:grid; grid-template-columns:1fr 1fr; gap:15px; margin:20px 0; position:relative; z-index:1; }
    .podium-container{ display:flex; justify-content:center; align-items:flex-end; height:130px; gap:5px; padding-bottom:25px; }
    .podium-step{ width:45px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; color:#fff; border-radius:8px; position:relative; font-size:.75rem; transition:.5s; }
    .p-1{ height:100px; background:linear-gradient(135deg,#ffd700,#b8860b); }
    .p-2{ height:75px;  background:linear-gradient(135deg,#bdc3c7,#7f8c8d); }
    .p-3{ height:55px;  background:linear-gradient(135deg,#cd7f32,#8b4513); }
    .p-4{ height:40px;  background:linear-gradient(135deg,#95a5a6,#2c3e50); }
    .p-name{ position:absolute; bottom:-25px; color:var(--text); font-weight:bold; font-size:.8rem; white-space:nowrap; }

    .knights-section{ background:linear-gradient(135deg,#fff,#fdf8e6); border:2px solid var(--gold); border-radius:15px; padding:15px; margin:20px 0; box-shadow:0 5px 15px rgba(0,0,0,.1); }
    body.dark-mode .knights-section{ background:linear-gradient(135deg,#252525,#1e1e1e); }
    .knights-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:10px; }
    .knight-card{ background:#fff; border:1px solid var(--gold-light); border-radius:12px; padding:10px; text-align:center; position:relative; overflow:hidden; transition:.3s; }
    .knight-card:hover{ transform:translateY(-3px); box-shadow:0 4px 8px rgba(0,0,0,.1); }
    .knight-title{ font-size:.75rem; font-weight:bold; color:var(--accent); margin-bottom:5px; display:block; border-bottom:1px solid #eee; padding-bottom:3px; }
    .knight-name{ font-size:1rem; color:var(--primary); font-weight:bold; display:block; margin-top:5px; }
    .knight-icon{ font-size:1.5rem; display:block; }

    .user-cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px; }
    .comp-card{ padding:10px; text-align:center; border:2px solid var(--gold-light); border-radius:15px; cursor:pointer; background:#fff; transition:.3s; position:relative; }
    .comp-card.active{ border-color:var(--primary); background:#f0f7f2; transform:scale(1.02); }
    body.dark-mode .comp-card.active{ background:#2d6a4f; color:#fff; }
    .user-status{ font-size:.7rem; color:#d35400; margin-top:5px; border-top:1px solid #eee; padding-top:5px; min-height:35px; }
    .blocked-badge{
      display:none; position:absolute; top:6px; left:6px; background:#8b0000; color:#fff; border-radius:8px; padding:2px 6px; font-weight:800; font-size:.75rem;
    }
    .comp-card.blocked .blocked-badge{ display:inline-block; }
    .comp-card.blocked{ opacity:.45; filter:grayscale(.7); pointer-events:none; cursor:not-allowed; }

    .section-card{ background:#fff; border:1px solid var(--gold); border-radius:15px; margin-top:15px; overflow:hidden; }
    .section-title{ background:var(--primary); color:#fff; padding:10px; margin:0; font-size:1rem; }
    .habit-row{ display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px dashed var(--gold-light); }
    .habit-link{ color:var(--primary); text-decoration:none; border-bottom:1px dashed var(--gold); }
    .habit-link:hover{ text-decoration:underline; }
    .pts-info{ font-size:.65rem; color:#666; display:block; }
    .opt-btn{ font-size:.7rem; padding:6px 2px; border-radius:6px; border:1px solid var(--gold); cursor:pointer; flex:1; margin:0 1px; background:transparent; color:inherit; }
    .opt-btn.selected{ background:var(--gold); color:#fff; }

    .chat-section{ background:#fff; border:2px solid var(--primary); border-radius:15px; margin-top:20px; height:350px; display:flex; flex-direction:column; position:relative; }
    .chat-messages{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:5px; }
    .chat-msg{ padding:8px; border-radius:10px; max-width:80%; font-size:.85rem; position:relative; }
    .chat-input-area{ padding:10px; display:flex; gap:5px; align-items:center; border-top:1px solid #eee; background:#fdfdfd; border-radius:0 0 15px 15px; }
    .chat-input{ flex:1; padding:10px; border:1px solid var(--gold); border-radius:20px; outline:none; background:inherit; color:inherit; }
    .chat-tools{ display:flex; gap:8px; align-items:center; }
    .tool-btn{ background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--primary); padding:0; display:flex; align-items:center; }

    .date-debug{ margin-top:8px; font-size:.78rem; line-height:1.4; background:#fff; color:#333; border:1px dashed var(--gold); border-radius:8px; padding:6px 8px; text-align:start; }
    body.dark-mode .date-debug{ background:#252525; color:#eee; }
    .toast{ position:fixed; top:12px; right:12px; z-index:2000; background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; border:2px solid var(--gold); border-radius:12px; padding:10px 14px; box-shadow:0 10px 24px rgba(0,0,0,.2); display:none; }
    .toast.show{ display:block; animation:fadeInOut 6s ease forwards; }

    .decor-container{ position:fixed; inset:0; pointer-events:none; z-index:0; }
    .decor-top{
      position:absolute; top:0; left:0; right:0; height:80px;
      display:flex; align-items:flex-start; justify-content:center; gap:40px;
      background:linear-gradient(180deg,rgba(197,160,89,.12),rgba(197,160,89,0));
    }
    .lantern{ font-size:30px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); animation:swing 3.8s ease-in-out infinite; transform-origin:top center; margin-top:6px; }
    .crescent{ position:absolute; top:12px; right:16px; font-size:28px; filter:drop-shadow(0 0 6px rgba(255,255,180,.6)); }
    .stars{ position:absolute; inset:0; opacity:.5; animation: twinkle 6s ease-in-out infinite alternate; }

    .all-done-badge{ margin:10px 0; padding:10px 14px; border:2px solid var(--gold); border-radius:14px; background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; font-weight:800; text-align:center; box-shadow:0 0 14px rgba(240,198,116,.45); }
    .eid-banner{ display:none; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#fff7d6; color:#7a5a22; border:2px solid var(--gold); border-radius:12px; padding:8px 12px; z-index:1200; font-weight:800; }
  </style>
</head>
<body>

<button class="dark-mode-toggle" onclick="toggleDarkMode()">🌓</button>

<div class="main-container">
  <div class="header-bar">
    <h2 id="app-title" style="margin:0; font-family:'Reem Kufi'; color: var(--gold-light);">🕌 ملتقى طاعاتنا 2026</h2>

    <div class="header-actions">
      <button class="refresh-btn" onclick="location.reload()">🔄 تحديث البيانات</button>
      <button class="refresh-btn" id="btn-save-all">💾 حفظ التعديلات</button>
      <select id="city-select-1" class="city-select"></select>
      <select id="city-select-2" class="city-select"></select>
      <button class="refresh-btn" id="btn-admin-access">⚙️</button>
    </div>

    <div id="admin-panel" style="display:none; background:#fff; color:#333; border:2px dashed var(--gold); border-radius:12px; padding:15px; margin-top:10px; text-align:start;">
      <h4 style="margin:0 0 10px 0; color:var(--accent);">🛠️ تصحيح العبادات (المدير)</h4>
      <div style="display:flex; flex-wrap:wrap; gap:8px; background:#f9f6f0; padding:10px; border-radius:8px;">
        <select id="adm-user-fix" class="city-select"></select>
        <select id="adm-habit-fix" class="city-select"></select>
        <select id="adm-status-fix" class="city-select">
          <option value="none">لم يحدد</option>
          <option value="m">بالمسجد</option>
          <option value="g">جماعة</option>
          <option value="f">فردي</option>
          <option value="done">تم الإكمال</option>
        </select>
        <button class="refresh-btn" onclick="applyAdminFix()" style="background:var(--accent); color:#fff;">✅ تنفيذ التصحيح</button>
      </div>
      <p style="font-size:0.8rem; color:#666;">* التصحيح يتم لليوم المختار في التقويم.</p>
    </div>

    <div class="date-container">
      <span id="hijri-display">جاري التحميل...</span>
      <input type="date" id="date-picker" style="border-radius:5px; border:none; padding:5px; font-weight:bold;">
    </div>

    <table class="prayer-times-table">
      <thead><tr><th>المدينة</th><th>الفجر</th><th>الظهر</th><th>العصر</th><th>المغرب</th><th>العشاء</th></tr></thead>
      <tbody id="prayer-table-body">
        <tr id="row-salalah"><td>صلالة</td><td colspan="5">...</td></tr>
        <tr id="row-kafr"><td>كفر الشيخ</td><td colspan="5">...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="podium-section">
    <div><h4 style="text-align:center;">🏆 توب اليوم</h4><div id="daily-podium" class="podium-container"></div></div>
    <div><h4 style="text-align:center;">✨ الترتيب السنوي</h4><div id="annual-podium" class="podium-container"></div></div>
  </div>

  <div class="knights-section">
    <h3 style="text-align:center; color:var(--primary);">⚔️ فرسان الأسبوع</h3>
    <div class="knights-grid" id="knights-display"></div>
  </div>

  <div class="hadith-marquee"><div id="daily-hadith" class="hadith-text"></div></div>

  <div id="cards-ui" class="user-cards"></div>

  <div id="user-ui" style="display:none;">
    <h3 id="current-user-title" style="text-align:center;"></h3>
    <div id="fard-list" class="section-card"></div>
    <div id="sunan-list" class="section-card"></div>
    <div id="extra-list" class="section-card"></div>
  </div>

  <div class="chat-section">
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <select id="chat-user-selector" class="city-select"><option value="">من أنت؟</option></select>
      <input type="text" id="chat-input" class="chat-input" placeholder="رسالة تشجيعية...">
      <button onclick="sendMessage()" class="refresh-btn">➤</button>
    </div>
  </div>
</div>

<script>
  // Firebase
  const firebaseConfig = { apiKey: "AIzaSyDBa3kZK5ibQEIRRjVIHL7JIOHixX_7rVs", databaseURL: "https://ebada-656e1-default-rtdb.firebaseio.com" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const users = ['محمد','شيماء','أحمد','ياسين'];
  const habits = [
    {id:'fajr', n:'الفجر'}, {id:'dhuhr', n:'الظهر'}, {id:'asr', n:'العصر'},
    {id:'maghrib', n:'المغرب'}, {id:'isha', n:'العشاء'}, {id:'quran', n:'الورد'}
  ];

  // دالة الدخول للمدير بالرمز 9090
  document.getElementById('btn-admin-access').onclick = function() {
    const pw = prompt("أدخل رمز المدير:");
    if(pw === "9090") {
      document.getElementById('admin-panel').style.display = 'block';
      initAdminFixSelectors();
    } else {
      alert("رمز خاطئ!");
    }
  };

  function initAdminFixSelectors() {
    const uS = document.getElementById('adm-user-fix');
    const hS = document.getElementById('adm-habit-fix');
    if(uS.options.length > 0) return;
    users.forEach(u => uS.add(new Option(u, u)));
    habits.forEach(h => hS.add(new Option(h.n, h.id)));
  }

  function applyAdminFix() {
    const user = document.getElementById('adm-user-fix').value;
    const habit = document.getElementById('adm-habit-fix').value;
    const status = document.getElementById('adm-status-fix').value;
    const date = document.getElementById('date-picker').value;

    if(!date) return alert("اختر التاريخ أولاً");
    
    db.ref(`data/${date}/${user}/${habit}`).set(status)
      .then(() => alert("✅ تم التصحيح بنجاح!"))
      .catch(e => alert("خطأ: " + e.message));
  }

  // تهيئة عامة
  window.onload = () => {
    document.getElementById('date-picker').value = new Date().toISOString().split('T')[0];
    const uCards = document.getElementById('cards-ui');
    const chatSel = document.getElementById('chat-user-selector');
    users.forEach(u => {
      const d = document.createElement('div');
      d.className = 'comp-card';
      d.innerText = u;
      d.onclick = () => { currentUser=u; document.getElementById('user-ui').style.display='block'; };
      uCards.appendChild(d);
      chatSel.add(new Option(u, u));
    });
    // تحميل الحديث والمواقيت والفرسان... (بقية الدوال الأصلية)
  };

  function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
  function sendMessage() { /* كود الشات الأصلي */ }
</script>
</body>
</html>
