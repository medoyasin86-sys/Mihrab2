<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ملتقى طاعاتنا 2026 | النسخة المطورة</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
      --card-bg:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;
    }
    body.dark-mode{
      --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --primary:#2d6a4f;
    }
    body{
      font-family:'Amiri',serif; background-color:var(--bg); margin:0; padding:10px; color:var(--text);
      transition:background .3s;
    }
    .main-container{
      max-width:900px; margin:auto; background:var(--card-bg); border:3px double var(--gold); border-radius:20px;
      padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.2); position:relative; z-index:1;
    }

    /* ⭐ التوقيع السائل للاسم */
    #current-user-title {
        font-family: 'Reem Kufi', sans-serif;
        font-style: italic;
        background: linear-gradient(45deg, var(--primary), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
        padding: 5px 20px;
        transition: 0.5s ease;
    }
    #current-user-title:hover { transform: skewX(-10deg); }

    .dark-mode-toggle{ position:fixed; top:15px; left:15px; z-index:1000; background:var(--gold); border:none; border-radius:50%;
      width:40px; height:40px; cursor:pointer; font-size:1.2rem; box-shadow:0 2px 10px rgba(0,0,0,.2); }
    .header-bar{ background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; padding:15px; border-radius:15px; text-align:center; border:2px solid var(--gold); }
    .header-actions{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; align-items:center; }
    .refresh-btn{ background:linear-gradient(180deg,#ffe9b9,#e7cb83); border:1px solid var(--gold); color:#1a1a1a; padding:6px 10px; border-radius:20px; cursor:pointer; font-weight:800; }
    .city-select{ border:1px solid var(--gold); border-radius:8px; padding:4px 8px; background:#fff; color:#1a1a1a; font-weight:700; }
    
    .admin-panel { background: #eee; padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid #ccc; display: none; }
    body.dark-mode .admin-panel { background: #333; color: #fff; }

    .date-container{ background:rgba(255,255,255,.1); padding:10px; border-radius:12px; margin:10px 0; border:1px solid rgba(197,160,89,.3); }
    #hijri-display{ display:block; color:var(--gold-light); font-size:1.2rem; font-weight:bold; margin-bottom:5px; }

    .prayer-times-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:.8rem; background:rgba(0,0,0,.2); border-radius:10px; overflow:hidden; }
    .prayer-times-table th, .prayer-times-table td{ padding:5px; border:1px solid rgba(255,255,255,.1); text-align:center; }

    .section-card{ background:#fff; border:1px solid var(--gold); border-radius:15px; margin-top:15px; overflow:hidden; }
    .section-title{ background:var(--primary); color:#fff; padding:10px; margin:0; font-size:1rem; }
    .habit-row{ display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px dashed var(--gold-light); }
    
    .chat-section{ background:#fff; border:2px solid var(--primary); border-radius:15px; margin-top:20px; height:350px; display:flex; flex-direction:column; position:relative; }
    .chat-messages{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:5px; }
    .chat-input-area{ padding:10px; display:flex; gap:5px; align-items:center; border-top:1px solid #eee; background:#fdfdfd; border-radius:0 0 15px 15px; }
    .chat-input{ flex:1; padding:10px; border:1px solid var(--gold); border-radius:20px; outline:none; background:inherit; color:inherit; }

    /* زينة رمضان */
    .decor-container{ position:fixed; inset:0; pointer-events:none; z-index:0; }
    .lantern{ font-size:30px; animation:swing 3.8s ease-in-out infinite; transform-origin:top center; display: inline-block; }
    @keyframes swing{ 0%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} 100%{transform:rotate(-5deg);} }
  </style>
</head>
<body>

<button class="dark-mode-toggle" onclick="toggleDarkMode()">🌓</button>

<div class="main-container">
  <div class="header-bar">
    <h2 id="app-title" style="margin:0; font-family:'Reem Kufi'; color: var(--gold-light);">🕌 ملتقى طاعاتنا 2026</h2>

    <div class="header-actions">
      <button class="refresh-btn" id="btn-refresh">🔄 تحديث</button>
      <button class="refresh-btn" id="btn-save-all">💾 حفظ</button>
      <button class="refresh-btn" onclick="toggleAdminPanel()">⚙️ الإدارة</button>
      
      <select id="city-select-1" class="city-select"></select>
      <select id="city-select-2" class="city-select"></select>
    </div>

    <div id="admin-panel" class="admin-panel">
        <h4>لوحة تحكم الإدارة</h4>
        <div id="banned-list"></div>
    </div>

    <div class="date-container">
      <span id="hijri-display">جاري تحديد التاريخ...</span>
      <input type="date" id="date-picker">
    </div>

    <table class="prayer-times-table">
      <thead><tr><th>المدينة</th><th>الفجر</th><th>الظهر</th><th>العصر</th><th>المغرب</th><th>العشاء</th></tr></thead>
      <tbody id="prayer-table-body">
        <tr id="row-salalah"><td>صلالة</td><td colspan="5">...</td></tr>
        <tr id="row-kafr"><td>كفر الشيخ</td><td colspan="5">...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="cards-ui" class="user-cards" style="display: flex; gap: 10px; margin: 20px 0; justify-content: center;"></div>

  <div id="user-ui" style="display:none;">
    <div style="text-align: center;"><h3 id="current-user-title"></h3></div>

    <div id="fasting-section" class="section-card">
      <h3 class="section-title" style="background:var(--accent);">🌟 صيام التطوع</h3>
      <div id="fasting-list"></div>
    </div>

    <div class="section-card"><h3 class="section-title">🕋 الفرائض</h3><div id="fard-list"></div></div>
    <div class="section-card"><h3 class="section-title">🌱 السنن</h3><div id="sunan-list"></div></div>
    <div class="section-card"><h3 class="section-title">📿 الأذكار والورد</h3><div id="extra-list"></div></div>
  </div>

  <div class="chat-section">
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" class="chat-input" placeholder="اكتب رسالة..."/>
      <button onclick="sendMessage()" style="border-radius:50%; width:40px; height:40px; border:none; background:var(--primary); color:#fff; cursor:pointer;">➤</button>
    </div>
  </div>
</div>

<script>
  /* ========= الإعدادات والحظر ========= */
  let users = ['محمد','شيماء','أحمد','ياسين'];
  let bannedUsers = ['ياسين']; // حظر ياسين حتى إشعار آخر
  let currentUser = null;

  /* ========= قاعدة البيانات (النموذج) ========= */
  const model = {
    fard: [
      {id:'fajr', n:'🌄 الفجر', pts: {m:100, g:30, f:15}},
      {id:'dhuhr', n:'☀️ الظهر', pts: {m:50, g:30, f:15}},
      {id:'asr', n:'🌤️ العصر', pts: {m:50, g:30, f:15}},
      {id:'maghrib', n:'🌅 المغرب', pts: {m:50, g:30, f:15}},
      {id:'isha', n:'🌃 العشاء', pts: {m:50, g:30, f:15}}
    ],
    sunan: [
      {id:'s_fajr', n:'سنة الفجر', p:20}, 
      {id:'s_duha', n:'صلاة الضحى', p:25},
      {id:'s_qyam', n:'قيام الليل', p:40}
    ],
    extra: [
      {id:'azkar_s', n:'أذكار الصباح', p:30},
      {id:'quran', n:'الورد القرآني', p:50}
    ],
    fasting: [
      {id:'fast_mon', n:'صيام الاثنين', p:100},
      {id:'fast_thu', n:'صيام الخميس', p:100}
    ]
  };

  /* ========= إدارة الواجهة ========= */
  function renderUserCards() {
    const container = document.getElementById('cards-ui');
    container.innerHTML = '';
    // تصفية المستخدمين المحظورين
    const activeUsers = users.filter(u => !bannedUsers.includes(u));
    
    activeUsers.forEach(u => {
      const btn = document.createElement('button');
      btn.className = 'refresh-btn';
      btn.innerText = u;
      btn.onclick = () => selectUser(u);
      container.appendChild(btn);
    });
    renderBannedList();
  }

  function selectUser(name) {
    currentUser = name;
    document.getElementById('user-ui').style.display = 'block';
    document.getElementById('current-user-title').innerText = name;
    checkRamadanStatus();
    renderTasks();
  }

  function checkRamadanStatus() {
    // محاكاة التحقق من شهر رمضان (بناءً على تاريخ اليوم 20 فبراير 2026)
    const isRamadan = true; 
    const fastingSection = document.getElementById('fasting-section');
    const fardList = model.fard;

    if (isRamadan) {
      fastingSection.style.display = 'none'; // إخفاء التطوع
      // إضافة صيام رمضان للفرائض إذا لم يكن موجوداً
      if (!fardList.find(i => i.id === 'ramadan_f')) {
        fardList.unshift({id:'ramadan_f', n:'🌙 صيام يوم رمضان', pts: {m:200}, d:'200 نقطة'});
      }
    } else {
      fastingSection.style.display = 'block';
      model.fard = fardList.filter(i => i.id !== 'ramadan_f');
    }
  }

  function renderTasks() {
    const render = (list, elementId) => {
      const el = document.getElementById(elementId);
      el.innerHTML = list.map(item => `
        <div class="habit-row">
          <span>${item.n}</span>
          <input type="checkbox">
        </div>
      `).join('');
    };
    render(model.fard, 'fard-list');
    render(model.sunan, 'sunan-list');
    render(model.extra, 'extra-list');
  }

  /* ========= نظام الحظر الإداري ========= */
  function toggleAdminPanel() {
    const p = document.getElementById('admin-panel');
    p.style.display = p.style.display === 'none' ? 'block' : 'none';
  }

  function renderBannedList() {
    const list = document.getElementById('banned-list');
    list.innerHTML = bannedUsers.length ? 'المحظورون: ' : 'لا يوجد محظورون';
    bannedUsers.forEach(u => {
      list.innerHTML += `<button onclick="unbanUser('${u}')" style="margin:5px; color:red;">إلغاء حظر ${u}</button>`;
    });
  }

  function unbanUser(name) {
    bannedUsers = bannedUsers.filter(u => u !== name);
    renderUserCards();
    alert(`تم إلغاء حظر ${name}`);
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }

  // تشغيل أولي
  renderUserCards();
</script>

</body>
</html>
