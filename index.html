<script>
  function renderForms(userData, isFriday, fastingDay, selectedDate) {
    const fastSection = document.getElementById('fasting-section');

    // هل اليوم في رمضان؟
    const isRamadanToday =
      (document.getElementById('hijri-display').innerText.includes('رمضان')) ||
      (ymdInTz(selectedDate, APP_TZ) === '2026-02-19'); // مرجع البداية لديك

    // في رمضان: نخفي قسم الصيام التطوعي العلوي حتى لا يتكرر
    if (isRamadanToday) {
      if (fastSection) fastSection.style.display = 'none';
    } else {
      // خارج رمضان: منطقك السابق كما هو (إظهار الصيام التطوعي في أيامه فقط)
      if (fastSection) {
        if (fastingDay) {
          fastSection.style.display = 'block';
          document.getElementById('fasting-list').innerHTML = `<div class="habit-row">
            <span>🌙 صيام تطوع (الاثنين/الخميس/البيض) <small>(+100ن)</small></span>
            <input type="checkbox"
                   ${userData['fasting']?.done?'checked':''}
                   data-habit="fasting" data-p="100"
                   onchange="save('fasting',{done:this.checked, p:this.checked?100:0})"
                   style="transform:scale(1.5);">
          </div>`;
        } else {
          fastSection.style.display = 'none';
        }
      }
    }

    // تحضير قوائم الفرائض/الإضافي كما هي
    let curFard = [...model.fard];
    let curExtra = [...model.extra];
    if (isFriday) {
      curFard  = curFard.map(f => f.id === 'dhuhr' ? {...f, n:'🕌 صلاة الجمعة'} : f);
      curExtra.push({id:'kahf', n:'🕌 سورة الكهف', p:40, l:'https://quran.com/18'});
    }

    // 1) بناء HTML الفرائض الافتراضي (كما هو)
    const fardHTML = curFard.map(h => {
      const cur = userData[h.id]?.type;
      return `<div class="habit-row">
        <div><b>${h.n}</b><span class="pts-info">${h.d}</span></div>
        <div style="display:flex; gap:2px;">
          ${
            Object.entries(h.pts).map(([k,v]) =>
              `<button class="opt-btn ${cur===k?'selected':''}"
                       data-habit="${h.id}" data-type="${k}" data-p="${v}"
                       onclick="save('${h.id}',{type:'${k}', p:${v}})">
                 ${k=='m'?'مسجد':k=='g'?'جماعة':k=='f'?'فرد':'قضاء'}
               </button>`
            ).join('')
          }
        </div>
      </div>`;
    }).join('');

    // 2) إن كان اليوم في رمضان، نضيف صف "صيام رمضان" كأول عنصر ضمن الفرائض
    //    (يحفظ تحت 'fasting' كما هو للحفاظ على كل المنطق والتقارير بدون أي تغيير)
    const ramadanFastingRow = isRamadanToday ? `
      <div class="habit-row" style="border-bottom:2px dashed var(--gold-light);">
        <div><b>🕌 صيام شهر رمضان (فرض)</b><span class="pts-info">(+100 نقطة)</span></div>
        <div>
          <input type="checkbox"
                 ${userData['fasting']?.done?'checked':''}
                 data-habit="fasting" data-p="100"
                 onchange="save('fasting',{done:this.checked, p:this.checked?100:0})"
                 style="transform:scale(1.5); cursor:pointer;">
        </div>
      </div>
    ` : '';

    // حقن الفرائض في الواجهة (مع صف صيام رمضان في حالته)
    document.getElementById('fard-list').innerHTML = ramadanFastingRow + fardHTML;

    // السنن/الإضافي كما هي (مع رابط الجزء للورد في رمضان إن وُجد)
    const drawCheck = (list, tid) => {
      const rDay = getRamadanDayFor(selectedDate);
      document.getElementById(tid).innerHTML = list.map(h => {
        const done = userData[h.id]?.done;
        let url = h.l || null;
        if (h.id === 'quran' && rDay) url = `https://quran.com/juz/${rDay}`;
        const label = url
          ? `${url}${h.n}</a>`
          : h.n;
        return `<div class="habit-row">
          <span>${label} <small>(+${h.p}ن)</small></span>
          <input type="checkbox" ${done?'checked':''}
                 data-habit="${h.id}" data-p="${h.p}"
                 onchange="save('${h.id}',{done:this.checked, p:this.checked?${h.p}:0})"
                 style="transform:scale(1.5); cursor:pointer;">
        </div>`;
      }).join('');
    };
    drawCheck(model.sunan, 'sunan-list');
    drawCheck(curExtra, 'extra-list');
  }
</script>
