<div class="date-container">
  <span id="hijri-display">جاري تحديد التاريخ الهجري...</span>
  <div style="margin-top: 5px;">
    <label style="font-size: 0.8rem; color: var(--gold-light);">تعديل الهجري (أيام): </label>
    <input type="number" id="hijri-offset" value="0" style="width: 40px; border-radius: 5px; border: 1px solid var(--gold); text-align: center;" onchange="updateHijriWithOffset()">
  </div>
  <input type="date" id="date-picker" style="border-radius:5px; border:none; padding:5px; text-align:center; font-weight:bold; margin-top:5px;">
  <div id="ramadan-day-hint" class="ramadan-day-hint">🌙 اليوم هو <b>1 رمضان</b> — تقبّل الله منا ومنكم</div>
  <div id="date-debug" class="date-debug" aria-live="polite"></div>
</div>
