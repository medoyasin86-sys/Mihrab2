<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملتقى طاعاتنا 2026 | النسخة الشاملة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a4d2e; --gold: #c5a059; --gold-light: #e6cc92; --bg: #f9f6f0; --card-bg: #ffffff; --text: #1a4d2e; --accent: #d35400; }
        body.dark-mode { --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --primary: #2d6a4f; }
        body { font-family: 'Amiri', serif; background-color: var(--bg); margin: 0; padding: 10px; color: var(--text); transition: background 0.3s; }
        .main-container { max-width: 950px; margin: auto; background: var(--card-bg); border: 3px double var(--gold); border-radius: 20px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header-bar { background: linear-gradient(135deg, #1a4d2e, #0a2b1a); color: white; padding: 15px; border-radius: 15px; text-align: center; border: 2px solid var(--gold); position: relative; }
        
        /* Admin Section */
        #admin-auth-btn { position: absolute; top: 10px; right: 10px; opacity: 0.3; cursor: pointer; background: none; border: none; font-size: 1.2rem; }
        .admin-section { background: #fff; border: 2px solid var(--accent); border-radius: 15px; margin: 20px 0; padding: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .report-table th, .report-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .report-table th { background: var(--primary); color: white; }

        /* General UI */
        .podium-section { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .podium-container { display: flex; justify-content: center; align-items: flex-end; height: 120px; gap: 5px; padding-bottom: 25px; }
        .podium-step { width: 45px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; color: white; border-radius: 8px; position: relative; font-size: 0.75rem; transition: 0.5s; }
        .p-1 { height: 100px; background: linear-gradient(135deg, #ffd700, #b8860b); }
        .p-2 { height: 75px; background: linear-gradient(135deg, #bdc3c7, #7f8c8d); }
        .p-3 { height: 55px; background: linear-gradient(135deg, #cd7f32, #8b4513); }
        .p-name { position: absolute; bottom: -25px; color: var(--text); font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        
        .knights-section { background: linear-gradient(135deg, #fff, #fdf8e6); border: 2px solid var(--gold); border-radius: 15px; padding: 15px; margin: 20px 0; }
        .knights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; text-align: center; }
        .knight-card { background: white; border: 1px solid var(--gold-light); border-radius: 12px; padding: 10px; }

        .user-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .comp-card { padding: 10px; text-align: center; border: 2px solid var(--gold-light); border-radius: 15px; cursor: pointer; background: #fff; }
        .comp-card.active { border-color: var(--primary); background: #f0f7f2; transform: scale(1.02); }

        .section-card { background: white; border: 1px solid var(--gold); border-radius: 15px; margin-top: 15px; overflow: hidden; }
        .section-title { background: var(--primary); color: white; padding: 10px; margin: 0; font-size: 1rem; }
        .habit-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px dashed #eee; }
        .opt-btn { font-size: 0.75rem; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--gold); cursor: pointer; background: transparent; }
        .opt-btn.selected { background: var(--gold); color: white; }

        .chat-section { background: white; border: 2px solid var(--primary); border-radius: 15px; margin-top: 20px; height: 350px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .chat-msg { padding: 8px; border-radius: 10px; max-width: 80%; font-size: 0.85rem; }
        .chat-input-area { padding: 10px; display: flex; gap: 5px; background: #f9f9f9; border-radius: 0 0 15px 15px; }
        .niya-alert { background: #fff3cd; color: #856404; padding: 10px; border-radius: 10px; margin: 10px 0; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-bar">
        <button id="admin-auth-btn" onclick="authAdmin()">⚙️</button>
        <h2 style="margin:0; font-family:'Reem Kufi'; color: var(--gold-light);">🕌 ملتقى طاعاتنا 2026</h2>
        <div class="date-container">
            <span id="hijri-display" style="font-weight:bold; font-size:1.3rem; color:var(--gold-light);">...</span> <br>
            <input type="date" id="date-picker" style="border-radius:5px; padding:5px; border:none; margin-top:5px;">
        </div>
        <div id="niya-reminder" class="niya-alert"></div>
    </div>

    <div id="admin-panel" class="admin-section">
        <h3 style="text-align:center; color:var(--accent);">📈 مركز التقارير السرية (9090)</h3>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
            <button class="opt-btn" onclick="generateReport('daily')">تقرير يومي</button>
            <button class="opt-btn" onclick="generateReport('monthly')">تقرير شهري</button>
            <button class="opt-btn" onclick="generateReport('annual')">تقرير سنوي</button>
            <button class="opt-btn" style="background:var(--primary); color:#fff;" onclick="exportPDF()">تحميل PDF 📥</button>
        </div>
        <div id="report-output"></div>
    </div>

    <div class="podium-section">
        <div><h4 style="text-align:center; margin:2px;">🏆 توب اليوم</h4><div id="daily-podium" class="podium-container"></div></div>
        <div><h4 style="text-align:center; margin:2px;">✨ الترتيب السنوي</h4><div id="annual-podium" class="podium-container"></div></div>
    </div>

    <div class="knights-section">
        <h3 style="text-align:center; margin:0 0 10px 0; font-family:'Reem Kufi';">⚔️ فرسان الأسبوع</h3>
        <div class="knights-grid" id="knights-display"></div>
    </div>

    <div id="cards-ui" class="user-cards"></div>

    <div id="user-ui" style="display:none;">
        <h3 id="current-user-title" style="text-align:center; color:var(--primary); background: var(--gold-light); padding: 5px; border-radius: 10px;"></h3>
        <div id="fasting-section" class="section-card" style="display:none; border:2px solid var(--accent);"><h3 class="section-title" style="background:var(--accent);">🌙 قسم الصيام</h3><div id="fasting-list"></div></div>
        <div class="section-card"><h3 class="section-title">🕋 الفرائض (المسجد | جماعة | فردي)</h3><div id="fard-list"></div></div>
        <div class="section-card"><h3 class="section-title">🌱 السنن الرواتب والقيام</h3><div id="sunan-list"></div></div>
        <div class="section-card"><h3 class="section-title">📿 الأذكار والورد والقرآن</h3><div id="extra-list"></div></div>
    </div>

    <div class="chat-section">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input-area">
            <select id="chat-user-selector" style="border-radius:10px; padding:5px;"><option value="">من أنت؟</option><option value="محمد">محمد</option><option value="شيماء">شيماء</option><option value="أحمد">أحمد</option><option value="ياسين">ياسين</option></select>
            <input type="text" id="chat-input" style="flex:1; border-radius:20px; border:1px solid #ddd; padding:0 10px;" placeholder="اكتب رسالة...">
            <button onclick="sendMessage()" style="background:var(--primary); color:white; border:none; border-radius:50%; width:35px; height:35px;">➤</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDBa3kZK5ibQEIRRjVIHL7JIOHixX_7rVs", authDomain: "ebada-656e1.firebaseapp.com", databaseURL: "https://ebada-656e1-default-rtdb.firebaseio.com", projectId: "ebada-656e1" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let currentUser = null;
    const users = ['محمد', 'شيماء', 'أحمد', 'ياسين'];

    const model = {
        fard: [
            {id:'fajr', n:'🌄 الفجر', pts: {m:100, g:30, f:15}},
            {id:'dhuhr', n:'☀️ الظهر', pts: {m:50, g:30, f:15}},
            {id:'asr', n:'🌤️ العصر', pts: {m:50, g:30, f:15}},
            {id:'maghrib', n:'🌅 المغرب', pts: {m:50, g:30, f:15}},
            {id:'isha', n:'🌃 العشاء', pts: {m:50, g:30, f:15}}
        ],
        sunan: [
            {id:'s_fajr', n:'✨ سنة الفجر', p:20},
            {id:'s_dhuhr_b', n:'✨ سنة الظهر (قبل)', p:20},
            {id:'s_dhuhr_a', n:'✨ سنة الظهر (بعد)', p:15},
            {id:'s_maghrib', n:'✨ سنة المغرب', p:15},
            {id:'s_isha', n:'✨ سنة العشاء', p:15},
            {id:'s_duha', n:'☀️ صلاة الضحى', p:25},
            {id:'s_shaf', n:'🕯️ الشفع', p:15},
            {id:'s_witr', n:'🌌 الوتر', p:20},
            {id:'s_qyam', n:'🌙 قيام الليل', p:40}
        ],
        extra: [
            {id:'azkar_s', n:'☀️ أذكار الصباح', p:30},
            {id:'azkar_e', n:'🌙 أذكار المساء', p:30},
            {id:'azkar_n', n:'😴 أذكار النوم', p:30},
            {id:'mulk', n:'📖 سورة الملك', p:30},
            {id:'baqarah', n:'📖 خواتيم البقرة', p:20},
            {id:'quran', n:'📖 الورد القرآني', p:50}
        ]
    };

    function authAdmin() {
        const pass = prompt("أدخل الرقم السري للدخول لقسم التقارير:");
        if(pass === "9090") {
            document.getElementById('admin-panel').style.display = 'block';
            alert("تم تفعيل صلاحيات الإدارة");
        } else { alert("عذراً، الرقم السري خاطئ"); }
    }

    async function getHijriData(date) {
        try {
            let adj = new Date(date);
            adj.setDate(adj.getDate() - 1); // ضبط عُمان (22 فبراير = 4 رمضان)
            const d = adj.getDate(), m = adj.getMonth()+1, y = adj.getFullYear();
            const res = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
            const data = await res.json();
            return data.data.hijri;
        } catch(e) { return null; }
    }

    async function render(allData) {
        const selDate = document.getElementById('date-picker').value;
        const dObj = new Date(selDate);
        const hj = await getHijriData(dObj);
        
        if(hj) document.getElementById('hijri-display').innerText = `${hj.day} ${hj.month.ar} ${hj.year}هـ`;
        
        const isFriday = dObj.getDay() === 5;
        const isRamadan = hj && hj.month.en === "Ramadan";

        // التنبيه للنية
        let tom = new Date(dObj); tom.setDate(tom.getDate()+1);
        const hjTom = await getHijriData(tom);
        const alertBox = document.getElementById('niya-reminder');
        if(hjTom && (hjTom.month.en === "Ramadan" || [1,4].includes(tom.getDay()))) {
            alertBox.style.display = 'block';
            alertBox.innerHTML = `💡 نية الصيام: غداً ${hjTom.day} ${hjTom.month.ar}، لا تنسَ السحور.`;
        } else { alertBox.style.display = 'none'; }

        // حساب النقاط
        let stats = users.map(u => {
            let s = 0; let ud = allData[selDate]?.[u] || {};
            [...model.fard, ...model.sunan, ...model.extra].forEach(h => { if(ud[h.id]) s += (ud[h.id].p || 0); });
            if(isFriday && ud['kahf']) s += 40;
            if(ud['fasting']) s += 100;
            return { n: u, s: s };
        });

        drawPodium('daily-podium', stats);
        updateAnnual(allData);
        updateKnights(allData);

        document.getElementById('cards-ui').innerHTML = stats.map(st => `
            <div class="comp-card ${st.n === currentUser ? 'active' : ''}" onclick="selectUser('${st.n}')">
                <b>${st.n}</b> <br> <span style="color:var(--gold)">${st.s} نقطة</span>
            </div>`).join('');

        if(currentUser) renderForms(allData[selDate]?.[currentUser] || {}, isRamadan, isFriday);
    }

    function renderForms(ud, isRamadan, isFriday) {
        document.getElementById('fasting-section').style.display = isRamadan ? 'block' : 'none';
        if(isRamadan) {
            document.getElementById('fasting-list').innerHTML = `<div class="habit-row"><span>🌙 صيام اليوم (+100)</span><input type="checkbox" ${ud['fasting']?.done?'checked':''} onchange="save('fasting',{done:this.checked, p:this.checked?100:0})"></div>`;
        }

        let fards = [...model.fard];
        if(isFriday) fards = fards.map(f => f.id==='dhuhr' ? {id:'dhuhr', n:'🕌 صلاة الجمعة', pts: {m:100, g:30, f:15}} : f);

        document.getElementById('fard-list').innerHTML = fards.map(h => `
            <div class="habit-row"><span>${h.n}</span>
            <div style="display:flex; gap:2px;">${Object.entries(h.pts).map(([k,v]) => `
                <button class="opt-btn ${ud[h.id]?.type===k?'selected':''}" onclick="save('${h.id}',{type:'${k}', p:${v}})">${k=='m'?'مسجد':k=='g'?'جماعة':'فرد'}</button>`).join('')}
            </div></div>`).join('');

        let extras = [...model.extra];
        if(isFriday) extras.push({id:'kahf', n:'📖 سورة الكهف', p:40});

        const drawCheck = (list, tid) => {
            document.getElementById(tid).innerHTML = list.map(h => `<div class="habit-row"><span>${h.n} (+${h.p || 0})</span><input type="checkbox" ${ud[h.id]?.done?'checked':''} onchange="save('${h.id}',{done:this.checked, p:this.checked?${h.p || 0}:0})"></div>`).join('');
        };
        drawCheck(model.sunan, 'sunan-list');
        drawCheck(extras, 'extra-list');
    }

    function save(id, val) { const d = document.getElementById('date-picker').value; db.ref(`osraty/${d}/${currentUser}/${id}`).set(val); }
    function selectUser(n) { currentUser = n; document.getElementById('user-ui').style.display = 'block'; document.getElementById('current-user-title').innerText = n; db.ref('osraty').once('value', s => render(s.val()||{})); }

    function drawPodium(el, data) {
        const sorted = [...data].sort((a,b) => b.s - a.s);
        const steps = ['p-2', 'p-1', 'p-3'];
        document.getElementById(el).innerHTML = [1, 0, 2].map((idx, i) => {
            const u = sorted[idx] || {n: '-', s: 0};
            return `<div class="podium-step ${steps[i]}"><span>${u.s}</span><div class="p-name">${u.n}</div></div>`;
        }).join('');
    }

    function updateAnnual(data) {
        let annual = users.map(u => {
            let total = 0;
            Object.values(data).forEach(day => { if(day[u]) Object.values(day[u]).forEach(t => total += (t.p || 0)); });
            return { n: u, s: total };
        });
        drawPodium('annual-podium', annual);
    }

    function updateKnights(data) {
        let kStats = users.reduce((acc, u) => { acc[u] = { f:0, s:0 }; return acc; }, {});
        Object.keys(data).slice(-7).forEach(d => {
            users.forEach(u => {
                if(data[d][u]?.fajr?.type === 'm') kStats[u].f++;
                if(data[d][u]?.fasting?.done) kStats[u].s++;
            });
        });
        const getB = (k) => users.reduce((a, b) => kStats[a][k] >= kStats[b][k] ? a : b);
        document.getElementById('knights-display').innerHTML = `
            <div class="knight-card"><b>🕌 فارس الفجر</b><br>${getB('f')}</div>
            <div class="knight-card"><b>🌙 فارس الصيام</b><br>${getB('s')}</div>
        `;
    }

    // نظام التقارير المطور
    function generateReport(type) {
        db.ref('osraty').once('value', snap => {
            const data = snap.val() || {};
            let html = `<div id="report-to-print"><h2 style="text-align:center">تقرير طاعاتنا - ${type}</h2>
                        <table class="report-table"><tr><th>الاسم</th><th>إجمالي النقاط</th><th>الحالة</th></tr>`;
            users.forEach(u => {
                let total = 0;
                if(type === 'daily') {
                    const d = document.getElementById('date-picker').value;
                    Object.values(data[d]?.[u] || {}).forEach(t => total += (t.p || 0));
                } else if (type === 'monthly') {
                    const month = document.getElementById('date-picker').value.substring(0, 7);
                    Object.keys(data).forEach(d => { if(d.startsWith(month)) Object.values(data[d]?.[u] || {}).forEach(t => total += (t.p || 0)); });
                } else {
                    Object.values(data).forEach(day => { if(day[u]) Object.values(day[u]).forEach(t => total += (t.p || 0)); });
                }
                html += `<tr><td>${u}</td><td>${total}</td><td>${total > 300 ? '🥇 ممتاز' : '🌱 مجتهد'}</td></tr>`;
            });
            document.getElementById('report-output').innerHTML = html + `</table></div>`;
        });
    }

    function exportPDF() {
        const element = document.getElementById('report-to-print');
        if(!element) return alert("يرجى إنشاء التقرير أولاً");
        html2pdf().from(element).save(`تقرير_طاعاتنا_${Date.now()}.pdf`);
    }

    function sendMessage() {
        const inp = document.getElementById('chat-input'), user = document.getElementById('chat-user-selector').value;
        if(inp.value && user) { db.ref('osraty_chat').push({ u: user, m: inp.value }); inp.value = ''; }
    }

    window.onload = () => {
        const dp = document.getElementById('date-picker');
        dp.value = "2026-02-22"; 
        dp.onchange = () => db.ref('osraty').once('value', s => render(s.val()||{}));
        db.ref('osraty').on('value', s => render(s.val()||{}));
        db.ref('osraty_chat').limitToLast(15).on('value', s => {
            const div = document.getElementById('chat-messages');
            div.innerHTML = Object.values(s.val()||{}).map(m => `<div class="chat-msg" style="align-self:${m.u===currentUser?'flex-end':'flex-start'}; background:${m.u===currentUser?'#dcf8c6':'#eee'}"><b>${m.u}:</b> ${m.m}</div>`).join('');
            div.scrollTop = div.scrollHeight;
        });
    };
</script>
</body>
</html>
