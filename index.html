<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملتقى طاعاتنا 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#1a4d2e; --gold:#c5a059; --bg:#f9f6f0; --card:#fff; --text:#1a4d2e; }
        body.dark-mode { --bg:#121212; --card:#1e1e1e; --text:#e0e0e0; --primary:#2d6a4f; }
        body { font-family:'Amiri', serif; background-color:var(--bg); color:var(--text); margin:0; padding:10px; transition: 0.3s; }
        .main-container { max-width:800px; margin:auto; background:var(--card); border:3px double var(--gold); border-radius:20px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
        .header-bar { background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; padding:15px; border-radius:15px; text-align:center; border:2px solid var(--gold); }
        .date-container { background:rgba(255,255,255,0.1); padding:10px; border-radius:12px; margin:10px 0; }
        #hijri-display { font-size:1.3rem; font-weight:bold; color:var(--gold); display:block; margin-bottom:5px; }
        .user-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-top:20px; }
        .user-card { padding:15px; text-align:center; border:2px solid var(--gold); border-radius:15px; cursor:pointer; background:var(--card); font-weight:bold; }
        .user-card.active { background:var(--gold); color:#fff; }
        .section-card { background:var(--card); border:1px solid var(--gold); border-radius:15px; margin-top:15px; overflow:hidden; }
        .section-title { background:var(--primary); color:#fff; padding:8px; margin:0; font-size:1.1rem; }
        .habit-row { display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px dashed #ccc; }
        .chat-area { height:200px; overflow-y:auto; border:1px solid var(--gold); margin-top:10px; padding:10px; background:#fff; color:#000; border-radius:10px; }
        .input-group { display:flex; gap:5px; margin-top:10px; }
        input[type="text"] { flex:1; padding:8px; border-radius:10px; border:1px solid var(--gold); }
        .btn { background:var(--primary); color:#fff; border:none; padding:8px 15px; border-radius:10px; cursor:pointer; }
        .dark-mode-toggle { position:fixed; top:10px; left:10px; background:var(--gold); border:none; border-radius:50%; width:40px; height:40px; cursor:pointer; }
    </style>
</head>
<body>

<button class="dark-mode-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓</button>

<div class="main-container">
    <div class="header-bar">
        <h2 style="margin:0;">🕌 ملتقى طاعاتنا 2026</h2>
        <div class="date-container">
            <span id="hijri-display">جاري التحميل...</span>
            <input type="date" id="date-picker" onchange="updateHijri()">
        </div>
        <div id="ramadan-timer" style="font-size: 0.9rem; color: #e6cc92;"></div>
    </div>

    <div class="user-grid" id="user-selector">
        <div class="user-card" onclick="selectUser('محمد')">محمد</div>
        <div class="user-card" onclick="selectUser('شيماء')">شيماء</div>
        <div class="user-card" onclick="selectUser('أحمد')">أحمد</div>
        <div class="user-card" onclick="selectUser('ياسين')">ياسين</div>
    </div>

    <div id="habits-section" style="display:none;">
        <h3 id="current-user-name" style="text-align:center; color:var(--gold);"></h3>
        <div class="section-card">
            <h3 class="section-title">🕋 الفرائض والسنن</h3>
            <div id="habits-list"></div>
        </div>
        <button class="btn" style="width:100%; margin-top:10px; background:var(--gold);" onclick="saveToFirebase()">💾 حفظ التغييرات لليوم</button>
    </div>

    <div class="section-card" style="padding:10px;">
        <h3 style="margin:0 0 10px 0; color:var(--primary);">💬 مجلس الطاعة</h3>
        <div id="chat-box" class="chat-area"></div>
        <div class="input-group">
            <input type="text" id="chat-msg" placeholder="اكتب رسالة تشجيعية...">
            <button class="btn" onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>
</div>

<script>
    // 1. Config Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyDBa3kZK5ibQEIRRjVIHL7JIOHixX_7rVs", 
        authDomain: "ebada-656e1.firebaseapp.com", 
        databaseURL: "https://ebada-656e1-default-rtdb.firebaseio.com", 
        projectId: "ebada-656e1" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Variables
    let currentUser = "";
    const habits = ["الفجر", "الظهر", "العصر", "المغرب", "العشاء", "الضحى", "الوتر", "أذكار الصباح", "أذكار المساء", "ورد القرآن"];

    // 3. التاريخ الهجري (API Aladhan)
    async function updateHijri() {
        const dateInput = document.getElementById('date-picker').value;
        const [y, m, d] = dateInput.split('-');
        try {
            const response = await fetch(`https://api.aladhan.com/v1/gToH/${d}-${m}-${y}`);
            const data = await response.json();
            const hj = data.data.hijri;
            document.getElementById('hijri-display').innerText = `${hj.day} ${hj.month.ar} ${hj.year} هـ`;
            if (currentUser) loadUserData(); 
        } catch (e) {
            document.getElementById('hijri-display').innerText = "خطأ في الاتصال";
        }
    }

    // 4. اختيار المستخدم
    function selectUser(name) {
        currentUser = name;
        document.querySelectorAll('.user-card').forEach(c => {
            c.classList.remove('active');
            if(c.innerText === name) c.classList.add('active');
        });
        document.getElementById('habits-section').style.display = 'block';
        document.getElementById('current-user-name').innerText = "طاعات " + name;
        loadUserData();
    }

    // 5. تحميل وحفظ البيانات
    function loadUserData() {
        const date = document.getElementById('date-picker').value;
        const container = document.getElementById('habits-list');
        container.innerHTML = "جاري التحميل...";

        db.ref(`data/${date}/${currentUser}`).once('value', snapshot => {
            const data = snapshot.val() || {};
            container.innerHTML = habits.map(h => `
                <div class="habit-row">
                    <span>${h}</span>
                    <input type="checkbox" id="chk-${h}" ${data[h] ? 'checked' : ''}>
                </div>
            `).join('');
        });
    }

    function saveToFirebase() {
        const date = document.getElementById('date-picker').value;
        const saveData = {};
        habits.forEach(h => {
            saveData[h] = document.getElementById(`chk-${h}`).checked;
        });
        db.ref(`data/${date}/${currentUser}`).set(saveData)
            .then(() => alert("تم الحفظ بنجاح!"))
            .catch(err => alert("خطأ في الحفظ"));
    }

    // 6. الدردشة
    function sendChatMessage() {
        const msg = document.getElementById('chat-msg').value;
        if (!currentUser) { alert("اختر اسمك أولاً"); return; }
        if (!msg) return;
        db.ref('chat').push({ user: currentUser, text: msg, time: Date.now() });
        document.getElementById('chat-msg').value = "";
    }

    db.ref('chat').limitToLast(15).on('value', snapshot => {
        const box = document.getElementById('chat-box');
        box.innerHTML = "";
        snapshot.forEach(child => {
            const v = child.val();
            box.innerHTML += `<div><strong>${v.user}:</strong> ${v.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    });

    // 7. تشغيل أولي
    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date-picker').value = today;
        updateHijri();
        
        // عداد رمضان 2026
        const ramadan = new Date("February 18, 2026 18:00:00").getTime();
        setInterval(() => {
            const diff = ramadan - new Date().getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('ramadan-timer').innerText = days > 0 ? `متبقي على رمضان ${days} يوم` : "رمضان كريم";
        }, 1000);
    };
</script>
</body>
</html>
