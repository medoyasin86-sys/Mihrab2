<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ملتقى طاعاتنا 2026 | النسخة الإدارية الشاملة</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0;
      --card-bg:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;
    }
    body.dark-mode{ --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --primary:#2d6a4f; }
    body{ font-family:'Amiri',serif; background-color:var(--bg); margin:0; padding:10px; color:var(--text); transition:background .3s; }
    .main-container{ max-width:900px; margin:auto; background:var(--card-bg); border:3px double var(--gold); border-radius:20px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.2); position:relative; }

    /* Admin Styles */
    #admin-lock { position: absolute; top: 15px; right: 15px; cursor: pointer; opacity: 0.3; border: none; background: none; font-size: 1.2rem; }
    .admin-section { display: none; background: #fff; border: 3px solid var(--accent); border-radius: 15px; margin: 20px 0; padding: 15px; }
    .report-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
    .report-table th, .report-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    .report-table th { background: var(--primary); color: white; }
    .active-day { color: green; font-weight: bold; }
    .inactive-day { color: red; }

    .header-bar{ background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; padding:15px; border-radius:15px; text-align:center; border:2px solid var(--gold); }
    .date-container{ background:rgba(255,255,255,.1); padding:10px; border-radius:12px; margin:10px 0; border:1px solid rgba(197,160,89,.3); }
    
    .podium-container{ display:flex; justify-content:center; align-items:flex-end; height:120px; gap:5px; padding-bottom:25px; }
    .podium-step{ width:45px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; color:#fff; border-radius:8px; position:relative; font-size:.7rem; }
    .p-1{ height:100px; background:linear-gradient(135deg,#ffd700,#b8860b); }
    .p-2{ height:75px;  background:linear-gradient(135deg,#bdc3c7,#7f8c8d); }
    .p-3{ height:55px;  background:linear-gradient(135deg,#cd7f32,#8b4513); }
    .p-name{ position:absolute; bottom:-25px; color:var(--text); font-weight:bold; font-size:.75rem; white-space:nowrap; }

    .user-cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px; }
    .comp-card{ padding:10px; text-align:center; border:2px solid var(--gold-light); border-radius:15px; cursor:pointer; background:#fff; position: relative; }
    .comp-card.active{ border-color:var(--primary); background:#f0f7f2; }
    .remaining-box { font-size: 0.7rem; color: #d35400; background: #fff5f0; border-radius: 8px; padding: 5px; margin-top: 5px; text-align: right; border: 1px solid #ffe0d0; }

    .section-card{ background:#fff; border:1px solid var(--gold); border-radius:15px; margin-top:15px; overflow:hidden; }
    .section-title{ background:var(--primary); color:#fff; padding:10px; margin:0; font-size:1rem; display: flex; justify-content: space-between; }
    .habit-row{ display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px dashed var(--gold-light); }
    .opt-btn{ font-size:.65rem; padding:5px 4px; border-radius:6px; border:1px solid var(--gold); cursor:pointer; flex:1; margin:0 1px; background:#fff; }
    .opt-btn.selected{ background:var(--gold); color:#fff; }
    .external-link { color: #2980b9; text-decoration: none; font-weight: bold; }

    .chat-section{ background:#fff; border:2px solid var(--primary); border-radius:15px; margin-top:20px; height:300px; display:flex; flex-direction:column; }
    .chat-messages{ flex:1; overflow-y:auto; padding:10px; }
    .chat-msg { background: #f1f1f1; padding: 5px 10px; border-radius: 10px; margin-bottom: 5px; width: fit-content; font-size: 0.85rem; }
  </style>
</head>
<body>

<button class="dark-mode-toggle" onclick="toggleDarkMode()" style="position:fixed; top:10px; left:10px; z-index:100; border-radius:50%; width:40px; height:40px;">🌓</button>

<div class="main-container">
  <button id="admin-lock" onclick="toggleAdmin()">⚙️</button>
  
  <div class="header-bar">
    <h2 style="margin:0; font-family:'Reem Kufi'; color: var(--gold-light);">🕌 ملتقى طاعاتنا 2026</h2>
    <div class="date-container">
      <span id="hijri-display">جاري التحميل...</span> <br>
      <input type="date" id="date-picker" style="border-radius:5px; border:none; padding:5px; font-weight:bold; margin-top:5px;">
    </div>
  </div>

  <div id="admin-panel" class="admin-section">
    <h3 style="text-align:center; color:var(--accent);">📊 لوحة التحكم والتقارير</h3>
    <div style="display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; justify-content:center;">
        <button class="opt-btn" onclick="generateReport('daily')">اليوم</button>
        <button class="opt-btn" onclick="generateReport('monthly')">الشهر</button>
        <button class="opt-btn" onclick="generateReport('annual')">السنة</button>
        <input type="date" id="report-start" class="opt-btn" style="flex:none; width:110px;">
        <input type="date" id="report-end" class="opt-btn" style="flex:none; width:110px;">
        <button class="opt-btn" style="background:var(--accent); color:#fff;" onclick="generateRangeReport()">تقرير مخصص</button>
    </div>
    <canvas id="reportChart" style="max-height: 200px; margin-bottom:15px;"></canvas>
    <div id="report-output"></div>
    <button class="opt-btn" style="background:var(--primary); color:#fff; width:100%; margin-top:10px;" onclick="exportPDF()">تصدير التقرير PDF</button>
  </div>

  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:15px 0;">
    <div id="daily-podium-box">
        <h4 style="text-align:center; margin:2px;">🏆 توب اليوم</h4>
        <div id="daily-podium" class="podium-container"></div>
    </div>
    <div id="annual-podium-box">
        <h4 style="text-align:center; margin:2px;">✨ السنوي</h4>
        <div id="annual-podium" class="podium-container"></div>
    </div>
  </div>

  <div id="cards-ui" class="user-cards"></div>

  <div id="user-ui" style="display:none;">
    <h3 id="current-user-title" style="text-align:center; color:var(--primary); background: var(--gold-light); padding: 8px; border-radius: 10px;"></h3>
    
    <div id="fast-section" class="section-card" style="border: 2px solid var(--accent);">
      <h3 class="section-title" id="fast-title" style="background:var(--accent);">🌙 صيام</h3>
      <div class="habit-row">
        <span id="fast-label">جارِ التحقق...</span>
        <input type="checkbox" id="fast-check" style="transform: scale(1.6);">
      </div>
    </div>

    <div class="section-card">
      <h3 class="section-title">🕋 الفرائض <span>(م:100 | ج:30 | ف:15 | ق:5)</span></h3>
      <div id="fard-list"></div>
    </div>

    <div class="section-card"><h3 class="section-title">🌱 السنن والرواتب</h3><div id="sunan-list"></div></div>
    
    <div class="section-card">
      <h3 class="section-title">📿 الأذكار والورد (alazkar.today)</h3>
      <div id="extra-list"></div>
    </div>
  </div>

  <div class="chat-section">
    <h4 style="margin:5px; text-align:center;">💬 مجلس الطاعة</h4>
    <div id="chat-messages" class="chat-messages"></div>
    <div style="padding:10px; display:flex; gap:5px; background:#f9f9f9; border-radius:0 0 15px 15px;">
      <select id="chat-user-selector" style="border-radius:10px; border:1px solid var(--gold); padding:5px;"><option value="محمد">محمد</option><option value="شيماء">شيماء</option><option value="أحمد">أحمد</option><option value="ياسين">ياسين</option></select>
      <input type="text" id="chat-input" style="flex:1; border-radius:20px; border:1px solid var(--gold); padding:0 10px;" placeholder="رسالة تشجيعية...">
      <button onclick="sendMessage()" style="background:var(--primary); color:#fff; border:none; border-radius:50%; width:35px; height:35px;">➤</button>
    </div>
  </div>
</div>

<script>
  // تهيئة Firebase بنفس بياناتك الأصلية
  const firebaseConfig = { apiKey: "AIzaSyDBa3kZK5ibQEIRRjVIHL7JIOHixX_7rVs", authDomain: "ebada-656e1.firebaseapp.com", databaseURL: "https://ebada-656e1-default-rtdb.firebaseio.com", projectId: "ebada-656e1" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const users = ['محمد', 'شيماء', 'أحمد', 'ياسين'];
  let currentUser = null;
  let myChart = null;

  // نموذج العبادات المطور
  const model = {
    fard: [
      {id:'fajr', n:'الفجر', pts: {m:100, g:30, f:15, q:5}},
      {id:'dhuhr', n:'الظهر', pts: {m:50, g:30, f:15, q:5}},
      {id:'asr', n:'العصر', pts: {m:50, g:30, f:15, q:5}},
      {id:'maghrib', n:'المغرب', pts: {m:50, g:30, f:15, q:5}},
      {id:'isha', n:'العشاء', pts: {m:50, g:30, f:15, q:5}}
    ],
    sunan: [
      {id:'s_fajr', n:'سنة الفجر', p:20}, {id:'s_duha', n:'الضحى', p:25},
      {id:'s_dhuhr_b', n:'الظهر (قبل)', p:20}, {id:'s_dhuhr_a', n:'الظهر (بعد)', p:15},
      {id:'s_maghrib', n:'سنة المغرب', p:15}, {id:'s_isha', n:'سنة العشاء', p:15},
      {id:'s_shaf', n:'الشفع والوتر', p:25}, {id:'s_qyam', n:'قيام الليل', p:40}
    ],
    extra: [
      {id:'az_s', n:'☀️ أذكار الصباح', p:30, url:'https://alazkar.today/morning-remembrances'},
      {id:'az_e', n:'🌙 أذكار المساء', p:30, url:'https://alazkar.today/evening-remembrances'},
      {id:'quran', n:'📖 الورد القرآني', p:50, url:'https://quran.com'},
      {id:'mulk', n:'📖 سورة الملك', p:30, url:'https://alazkar.today/surah-al-mulk'},
      {id:'az_n', n:'😴 أذكار النوم', p:20, url:'https://alazkar.today/sleep-remembrances'}
    ]
  };

  async function getHijri(date) {
    let adj = new Date(date); adj.setDate(adj.getDate() - 1);
    const res = await fetch(`https://api.aladhan.com/v1/gToH/${adj.getDate()}-${adj.getMonth()+1}-${adj.getFullYear()}`);
    const d = await res.json(); return d.data.hijri;
  }

  function toggleAdmin() {
    if(prompt("كلمة المرور:") === "9090") {
      const p = document.getElementById('admin-panel');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }
  }

  // حساب النقاط والمتبقي ليوم معين
  function calcPoints(ud, isRamadan, isFriday) {
    let pts = 0; let rem = [];
    if(ud?.fast) pts += isRamadan ? 150 : 50; else rem.push("الصيام");
    model.fard.forEach(f => { if(ud?.[f.id]) pts += ud[f.id].p; else rem.push(f.n); });
    model.sunan.forEach(s => { if(ud?.[s.id]) pts += s.p; else rem.push(s.n); });
    model.extra.forEach(e => { if(ud?.[e.id]) pts += e.p; else rem.push(e.n); });
    if(isFriday) { if(ud?.kahf) pts += 40; else rem.push("الكهف"); }
    return { pts, rem };
  }

  async function updateUI(allData) {
    const selDate = document.getElementById('date-picker').value;
    const hj = await getHijri(new Date(selDate));
    const isRamadan = hj.month.en === "Ramadan";
    const isFriday = new Date(selDate).getDay() === 5;

    document.getElementById('hijri-display').innerText = `${hj.day} ${hj.month.ar} ${hj.year}هـ`;

    // بطاقات المتسابقين
    let stats = users.map(u => {
      const res = calcPoints(allData[selDate]?.[u], isRamadan, isFriday);
      return { n: u, s: res.pts, rem: res.rem };
    });

    drawPodium('daily-podium', stats);
    
    // السنوي
    let annual = users.map(u => {
      let total = 0;
      Object.keys(allData).forEach(d => {
          total += calcPoints(allData[d][u], false, false).pts; // تبسيط للسنوي
      });
      return { n: u, s: total };
    });
    drawPodium('annual-podium', annual);

    document.getElementById('cards-ui').innerHTML = stats.map(st => `
      <div class="comp-card ${st.n === currentUser ? 'active' : ''}" onclick="selectUser('${st.n}')">
        <b>${st.n}</b> <br> <span style="color:var(--gold); font-weight:bold;">${st.s} نقطة</span>
        <div class="remaining-box">⏳ المتبقي: ${st.rem.length > 0 ? st.rem.join(' • ') : '🏆 كامل!'}</div>
      </div>`).join('');

    if(currentUser) renderTasks(allData[selDate]?.[currentUser] || {}, isRamadan, isFriday);
  }

  function renderTasks(ud, isRamadan, isFriday) {
    const label = isRamadan ? "فريضة صيام رمضان (+150ن)" : "صيام تطوع (+50ن)";
    document.getElementById('fast-label').innerText = label;
    document.getElementById('fast-check').checked = !!ud.fast;
    document.getElementById('fast-check').onclick = (e) => save('fast', e.target.checked);

    document.getElementById('fard-list').innerHTML = model.fard.map(f => `
      <div class="habit-row"><span>${f.n}</span>
      <div style="display:flex; gap:2px;">${Object.entries(f.pts).map(([k,v]) => `
        <button class="opt-btn ${ud[f.id]?.t===k?'selected':''}" onclick="save('${f.id}',{t:'${k}', p:${v}})">${k.toUpperCase()}</button>`).join('')}
      </div></div>`).join('');

    const drawCheck = (list, tid) => {
      document.getElementById(tid).innerHTML = list.map(h => `
        <div class="habit-row">
          <span>${h.url ? `<a href="${h.url}" target="_blank" class="external-link">🔗 ${h.n}</a>` : h.n} (+${h.p})</span>
          <input type="checkbox" ${ud[h.id]?'checked':''} onclick="save('${h.id}', this.checked)">
        </div>`).join('');
    };
    drawCheck(model.sunan, 'sunan-list');
    let extras = [...model.extra];
    if(isFriday) extras.push({id:'kahf', n:'📖 سورة الكهف', p:40, url:'https://alazkar.today/surah-al-kahf'});
    drawCheck(extras, 'extra-list');
  }

  function save(id, val) {
    const d = document.getElementById('date-picker').value;
    db.ref(`osraty/${d}/${currentUser}/${id}`).set(val);
  }

  function selectUser(n) {
    currentUser = n;
    document.getElementById('user-ui').style.display = 'block';
    document.getElementById('current-user-title').innerText = `لوحة تسجيل ${n}`;
    db.ref('osraty').once('value', s => updateUI(s.val()||{}));
  }

  function drawPodium(el, data) {
    const sorted = [...data].sort((a,b) => b.s - a.s);
    const steps = ['p-2', 'p-1', 'p-3'];
    document.getElementById(el).innerHTML = [1,0,2].map((idx, i) => {
      const u = sorted[idx] || {n:'-', s:0};
      return `<div class="podium-step ${steps[i]}"><span>${u.s}</span><div class="p-name">${u.n}</div></div>`;
    }).join('');
  }

  // التقارير المتطورة
  function displayReport(data, range, title) {
    let scores = users.map(u => {
        let total = 0, active = 0, inactive = 0;
        let details = [];
        range.forEach(d => {
            let p = calcPoints(data[d]?.[u], false, false).pts;
            total += p;
            if(p > 0) active++; else inactive++;
            details.push({date: d, points: p});
        });
        return { u, total, active, inactive, details };
    });

    if(myChart) myChart.destroy();
    myChart = new Chart(document.getElementById('reportChart'), {
        type: 'bar',
        data: { labels: users, datasets: [{ label: 'النقاط الكلية', data: scores.map(s=>s.total), backgroundColor: '#1a4d2e' }] }
    });

    let html = `<h4>${title}</h4><table class="report-table"><tr><th>المتسابق</th><th>النقاط</th><th>أيام فعالة</th><th>أيام غياب</th></tr>`;
    scores.forEach(s => {
        html += `<tr><td><b>${s.u}</b></td><td>${s.total}</td><td class="active-day">${s.active}</td><td class="inactive-day">${s.inactive}</td></tr>`;
    });
    document.getElementById('report-output').innerHTML = html + `</table>`;
  }

  function generateReport(type) {
    db.ref('osraty').once('value', snap => {
        const data = snap.val() || {};
        const sel = document.getElementById('date-picker').value;
        let range = [];
        if(type === 'daily') range = [sel];
        else if(type === 'monthly') range = Object.keys(data).filter(d => d.startsWith(sel.substring(0,7)));
        else range = Object.keys(data);
        displayReport(data, range, `تقرير ${type}`);
    });
  }

  function generateRangeReport() {
    const start = document.getElementById('report-start').value;
    const end = document.getElementById('report-end').value;
    db.ref('osraty').once('value', snap => {
        const data = snap.val() || {};
        const range = Object.keys(data).filter(d => d >= start && d <= end);
        displayReport(data, range, `تقرير من ${start} إلى ${end}`);
    });
  }

  function exportPDF() { html2pdf().from(document.getElementById('report-output')).save('تقرير_التميز.pdf'); }

  function sendMessage() {
    const u = document.getElementById('chat-user-selector').value;
    const m = document.getElementById('chat-input').value;
    if(m) { db.ref('chat').push({ u, m, t: Date.now() }); document.getElementById('chat-input').value = ''; }
  }

  function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

  window.onload = () => {
    const dp = document.getElementById('date-picker');
    dp.value = new Date().toISOString().split('T')[0];
    dp.onchange = () => db.ref('osraty').once('value', s => updateUI(s.val()||{}));
    
    db.ref('osraty').on('value', s => updateUI(s.val()||{}));
    db.ref('chat').limitToLast(20).on('value', s => {
      document.getElementById('chat-messages').innerHTML = Object.values(s.val()||{}).map(m => `<div class="chat-msg"><b>${m.u}:</b> ${m.m}</div>`).join('');
      const d = document.getElementById('chat-messages'); d.scrollTop = d.scrollHeight;
    });
  };
</script>
</body>
</html>
