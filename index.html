<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ملتقى طاعاتنا 2026 | النسخة المطورة</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#1a4d2e; --gold:#c5a059; --gold-light:#e6cc92; --bg:#f9f6f0; --card-bg:#ffffff; --text:#1a4d2e; --accent:#d35400; --crimson:#900c3f;}
    body.dark-mode{--bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --primary:#2d6a4f;}
    body{font-family:'Amiri',serif; background-color:var(--bg); margin:0; padding:10px; color:var(--text); transition:background .3s;}
    .main-container{max-width:900px; margin:auto; background:var(--card-bg); border:3px double var(--gold); border-radius:20px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,.2); position:relative; z-index:1;}
    .header-bar{background:linear-gradient(135deg,#1a4d2e,#0a2b1a); color:#fff; padding:15px; border-radius:15px; text-align:center; border:2px solid var(--gold);}
    .refresh-btn{background:linear-gradient(180deg,#ffe9b9,#e7cb83); border:1px solid var(--gold); color:#1a1a1a; padding:6px 10px; border-radius:20px; cursor:pointer; font-weight:800; margin:2px;}
    .reports-panel{background:#fff; color:#333; border:2px dashed var(--gold); border-radius:12px; padding:10px; text-align:start; margin-top:10px;}
    .admin-edit-box{background:#f0f7f2; border:1px solid var(--primary); padding:10px; border-radius:8px; margin-top:10px;}
    /* ... باقي التنسيقات الأصلية ... */
    .chat-section{background:#fff; border:2px solid var(--primary); border-radius:15px; margin-top:20px; height:350px; display:flex; flex-direction:column;}
    .chat-messages{flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:5px;}
    .chat-input-area{padding:10px; display:flex; gap:5px; background:#fdfdfd; border-top:1px solid #eee; border-radius:0 0 15px 15px;}
    .user-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;}
    .comp-card{padding:10px; border:2px solid var(--gold-light); border-radius:15px; text-align:center; cursor:pointer; background:#fff;}
    .comp-card.active{border-color:var(--primary); background:#f0f7f2;}
    .section-card{background:#fff; border:1px solid var(--gold); border-radius:15px; margin-top:15px; overflow:hidden;}
    .section-title{background:var(--primary); color:#fff; padding:10px; margin:0; font-size:1rem;}
    .habit-row{display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px dashed var(--gold-light);}
    .opt-btn{font-size:.7rem; padding:6px; border-radius:6px; border:1px solid var(--gold); cursor:pointer; flex:1; margin:0 2px;}
    .opt-btn.selected{background:var(--gold); color:#fff;}
    .decor-container{position:fixed; inset:0; pointer-events:none; z-index:0; display:block;}
    .lantern{font-size:30px; animation:swing 3.8s infinite; transform-origin:top;}
    @keyframes swing{0%,100%{transform:rotate(10deg)} 50%{transform:rotate(-10deg)}}
  </style>
</head>
<body>
<button class="dark-mode-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓</button>
<div class="main-container">
  <div class="header-bar">
    <h2 id="app-title" style="margin:0; font-family:'Reem Kufi'; color: var(--gold-light);">🕌 ملتقى طاعاتنا 2026</h2>
    <div class="header-actions">
      <button class="refresh-btn" id="btn-refresh">🔄 تحديث</button>
      <button class="refresh-btn" id="btn-save-all">💾 حفظ</button>
      <button class="refresh-btn" id="btn-reports-gear">⚙️ الإدارة</button>
    </div>

    <div id="reports-advanced-panel" class="reports-panel" style="display:none;">
      <h4 style="margin:0; color:var(--primary);">🛠️ لوحة التحكم (9090)</h4>
      <div class="admin-edit-box">
        <strong>✍️ تعديل عبادات مستخدم:</strong><br>
        <select id="edit-user-select" style="padding:5px; border-radius:5px; margin:5px 0;"></select>
        <select id="edit-habit-select" style="padding:5px; border-radius:5px;"></select>
        <select id="edit-value-select" style="padding:5px; border-radius:5px;"></select>
        <button class="refresh-btn" onclick="applyAdminEdit()">تعديل الآن</button>
      </div>
      <hr>
      <div id="admin-tools-original">
        <button class="refresh-btn" id="btn-block-user">⛔ حظر</button>
        <input type="date" id="block-from-date">
      </div>
    </div>
  </div>

  <div id="cards-ui" class="user-cards"></div>
  <div id="user-ui" style="display:none;">
    <h3 id="current-user-title" style="text-align:center; background:var(--gold-light); padding:5px; border-radius:10px;"></h3>
    <div class="section-card"><h3 class="section-title">🕋 الفرائض</h3><div id="fard-list"></div></div>
    <div class="section-card"><h3 class="section-title">🌱 السنن</h3><div id="sunan-list"></div></div>
    <div class="section-card"><h3 class="section-title">📿 الأذكار</h3><div id="extra-list"></div></div>
  </div>

  <div class="chat-section">
    <h4 style="text-align:center;">💬 مجلس الطاعة</h4>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" style="flex:1; border-radius:20px; padding:8px;" placeholder="اكتب هنا...">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<div class="decor-container"><div style="text-align:center" class="lantern">🏮</div></div>

<script>
  const firebaseConfig = { apiKey: "AIzaSyDBa3kZK5ibQEIRRjVIHL7JIOHixX_7rVs", authDomain: "ebada-656e1.firebaseapp.com", databaseURL: "https://ebada-656e1-default-rtdb.firebaseio.com", projectId: "ebada-656e1" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const users = ['محمد','شيماء','أحمد','ياسين'];
  let currentUser = null;
  let allData = {};

  // نموذج العبادات الموحد
  const habitModel = {
    fard: [ {id:'fajr', n:'الفجر'}, {id:'dhuhr', n:'الظهر'}, {id:'asr', n:'العصر'}, {id:'maghrib', n:'المغرب'}, {id:'isha', n:'العشاء'} ],
    sunan: [ {id:'s_fajr', n:'سنة الفجر'}, {id:'s_duha', n:'الضحى'}, {id:'s_qyam', n:'قيام الليل'} ],
    extra: [ {id:'azkar_s', n:'أذكار الصباح'}, {id:'azkar_e', n:'أذكار المساء'}, {id:'quran', n:'الورد القرآني'} ]
  };

  async function sync(){
    const snap = await db.ref('daily_habits/' + today()).once('value');
    allData = snap.val() || {};
    renderCards();
    if(currentUser) renderUserUI(currentUser);
    updateAdminSelectors();
  }

  function today(){ return new Date().toISOString().split('T')[0]; }

  function renderCards(){
    const container = document.getElementById('cards-ui');
    container.innerHTML = users.map(u => `
      <div class="comp-card ${currentUser===u?'active':''}" onclick="selectUser('${u}')">
        <strong>${u}</strong>
        <div style="font-size:0.7rem">نقاط اليوم: ${calculatePoints(u)}</div>
      </div>
    `).join('');
  }

  function selectUser(u){ currentUser=u; sync(); document.getElementById('user-ui').style.display='block'; }

  function renderUserUI(u){
    document.getElementById('current-user-title').innerText = "عبادات " + u;
    const userHabits = allData[u] || {};
    
    const draw = (list, targetId, type) => {
      document.getElementById(targetId).innerHTML = list.map(h => {
        const val = userHabits[h.id] || 'none';
        return `
          <div class="habit-row">
            <span>${h.n}</span>
            <div style="display:flex; gap:2px;">
              ${type==='fard' ? `
                <button class="opt-btn ${val==='m'?'selected':''}" onclick="updateHabit('${h.id}','m')">مسجد</button>
                <button class="opt-btn ${val==='g'?'selected':''}" onclick="updateHabit('${h.id}','g')">جماعة</button>
                <button class="opt-btn ${val==='f'?'selected':''}" onclick="updateHabit('${h.id}','f')">فردي</button>
              ` : `
                <button class="opt-btn ${val==='done'?'selected':''}" onclick="updateHabit('${h.id}','done')">تم</button>
              `}
              <button class="opt-btn ${val==='none'?'selected':''}" onclick="updateHabit('${h.id}','none')">✖</button>
            </div>
          </div>
        `;
      }).join('');
    };
    draw(habitModel.fard, 'fard-list', 'fard');
    draw(habitModel.sunan, 'sunan-list', 'other');
    draw(habitModel.extra, 'extra-list', 'other');
  }

  async function updateHabit(id, val){
    if(!currentUser) return;
    await db.ref(`daily_habits/${today()}/${currentUser}/${id}`).set(val);
    sync();
  }

  function calculatePoints(u){
    const d = allData[u] || {};
    let p = 0;
    Object.keys(d).forEach(k => { if(d[k]!=='none') p+=10; }); // تبسيط للنقاط
    return p;
  }

  // --- إدارة المدير ---
  document.getElementById('btn-reports-gear').onclick = () => {
    const pass = prompt("أدخل كلمة السر للإدارة:");
    if(pass === "9090"){
      const panel = document.getElementById('reports-advanced-panel');
      panel.style.display = panel.style.display==='none' ? 'block' : 'none';
      updateAdminSelectors();
    } else { alert("كلمة السر خاطئة!"); }
  };

  function updateAdminSelectors(){
    const uSel = document.getElementById('edit-user-select');
    uSel.innerHTML = users.map(u => `<option value="${u}">${u}</option>`).join('');
    
    const hSel = document.getElementById('edit-habit-select');
    let hts = "";
    [...habitModel.fard, ...habitModel.sunan, ...habitModel.extra].forEach(h => hts+=`<option value="${h.id}">${h.n}</option>`);
    hSel.innerHTML = hts;

    document.getElementById('edit-value-select').innerHTML = `
      <option value="done">تم / مسجد</option>
      <option value="none">لم يفعل</option>
      <option value="g">جماعة (للفرائض)</option>
      <option value="f">فردي (للفرائض)</option>
    `;
  }

  async function applyAdminEdit(){
    const u = document.getElementById('edit-user-select').value;
    const h = document.getElementById('edit-habit-select').value;
    const v = document.getElementById('edit-value-select').value;
    if(confirm(`تعديل ${h} للمستخدم ${u} إلى ${v}؟`)){
      await db.ref(`daily_habits/${today()}/${u}/${h}`).set(v);
      alert("تم التعديل بنجاح");
      sync();
    }
  }

  // --- شات مبسط ---
  function sendMessage(){
    const msg = document.getElementById('chat-input').value;
    if(!msg || !currentUser) return;
    db.ref('chat').push({user:currentUser, text:msg, time:Date.now()});
    document.getElementById('chat-input').value = "";
  }
  db.ref('chat').limitToLast(10).on('child_added', s => {
    const m = s.val();
    const div = document.createElement('div');
    div.innerHTML = `<b>${m.user}:</b> ${m.text}`;
    document.getElementById('chat-messages').appendChild(div);
  });

  sync();
  setInterval(sync, 30000);
</script>
</body>
</html>
